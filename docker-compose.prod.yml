version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ecofin-postgres-preprod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecofin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ecofin_publication}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecofin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecofin_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: ecofin-redis-preprod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - ecofin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    image: ${DOCKER_HUB_USERNAME:-noname1705}/ecofin-publication-backend:preprod
    container_name: ecofin-backend-preprod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecofin_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ecofin_publication}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      
      # JWT
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Blotato
      BLOTATO_API_KEY: ${BLOTATO_API_KEY}
      BLOTATO_LINKEDIN_ACCOUNT_ID: ${BLOTATO_LINKEDIN_ACCOUNT_ID}
      BLOTATO_X_ACCOUNT_ID: ${BLOTATO_X_ACCOUNT_ID}
      BLOTATO_FACEBOOK_ACCOUNT_ID: ${BLOTATO_FACEBOOK_ACCOUNT_ID}
      
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-sequencemedia.smtp.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-EcoFin Publication}
      
      # Application
      APP_NAME: ${APP_NAME:-EcoFin Publication}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./logs:/app/logs
    networks:
      - ecofin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecofin-backend.rule=Host(`${BACKEND_DOMAIN:-api-preprod.ecofin.local}`)"
      - "traefik.http.routers.ecofin-backend.entrypoints=websecure"
      - "traefik.http.routers.ecofin-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ecofin-backend.loadbalancer.server.port=8000"

  # Celery Worker
  celery-worker:
    image: ${DOCKER_HUB_USERNAME:-noname1705}/ecofin-publication-backend:preprod
    container_name: ecofin-celery-worker-preprod
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecofin_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ecofin_publication}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BLOTATO_API_KEY: ${BLOTATO_API_KEY}
      BLOTATO_LINKEDIN_ACCOUNT_ID: ${BLOTATO_LINKEDIN_ACCOUNT_ID}
      BLOTATO_X_ACCOUNT_ID: ${BLOTATO_X_ACCOUNT_ID}
      BLOTATO_FACEBOOK_ACCOUNT_ID: ${BLOTATO_FACEBOOK_ACCOUNT_ID}
    volumes:
      - ./logs:/app/logs
    networks:
      - ecofin-network

  # Celery Beat (Scheduler)
  celery-beat:
    image: ${DOCKER_HUB_USERNAME:-noname1705}/ecofin-publication-backend:preprod
    container_name: ecofin-celery-beat-preprod
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecofin_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ecofin_publication}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BLOTATO_API_KEY: ${BLOTATO_API_KEY}
    volumes:
      - ./logs:/app/logs
    networks:
      - ecofin-network

  # Frontend (React)
  frontend:
    image: ${DOCKER_HUB_USERNAME:-noname1705}/ecofin-publication-frontend:preprod
    container_name: ecofin-frontend-preprod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecofin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecofin-frontend.rule=Host(`${FRONTEND_DOMAIN:-preprod.ecofin.local}`)"
      - "traefik.http.routers.ecofin-frontend.entrypoints=websecure"
      - "traefik.http.routers.ecofin-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ecofin-frontend.loadbalancer.server.port=80"

networks:
  ecofin-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

