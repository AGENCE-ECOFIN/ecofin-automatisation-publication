version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15
    container_name: ecofin_db_local
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecofin_pub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ecofin_pub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecofin-network

  # Redis pour Celery
  redis:
    image: redis:7-alpine
    container_name: ecofin_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecofin-network

  # MinIO pour le stockage des images
  minio:
    image: minio/minio:latest
    container_name: ecofin_minio_local
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console web
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ecofin-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ecofin-network:
    driver: bridge
